name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Do not let repository-tool installs resolve missing lock data in CI.
  MISE_LOCKED: "1"
  LLVM_VERSION: "22.1.6"
  LLVM_LINUX_X64_SHA256: c5ac8ef89ca39d30cb32e9b83772f995dd891c685ebc188d593c943a64d5f8b5

jobs:
  repository-quality:
    name: Repository quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Set up repository tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: actionlint clang-format gersemi just node oxfmt precious shellcheck uv

      - name: Check formatting
        run: just check format all

      - name: Lint Python and workflows
        run: |
          just check lint py
          just check lint ci

  native:
    name: Native (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC 15, static, clang-tidy
            os: ubuntu-latest
            cc: gcc-15
            cxx: g++-15
            triplet: x64-linux
            toolchain: gcc
            preset: vcpkg-quality
            mise-tools: clang-tools cmake ninja just
            check-installed: true
            produce-simulation: true
          - name: Linux Clang 22, libc++, installed package
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            triplet: x64-linux
            toolchain: clang
            preset: vcpkg-release
            mise-tools: cmake ninja just
            check-installed: true
            produce-simulation: false
          - name: Windows MSVC, shared
            os: windows-latest
            cc: cl.exe
            cxx: cl.exe
            triplet: x64-windows
            toolchain: msvc
            preset: vcpkg-shared-release
            mise-tools: cmake ninja just
            check-installed: true
            produce-simulation: false
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up repository tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: ${{ matrix.mise-tools }}

      - name: Install GCC 15
        if: matrix.toolchain == 'gcc'
        shell: bash
        run: |
          # ubuntu-latest only includes GCC through version 14.
          sudo add-apt-repository --yes --no-update ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-15 g++-15

      - name: Install pinned LLVM
        if: matrix.toolchain == 'clang'
        uses: hydn10/setup-llvm@v1
        with:
          version: ${{ env.LLVM_VERSION }}
          linux-x64-sha256: ${{ env.LLVM_LINUX_X64_SHA256 }}

      - name: Configure Clang with libc++
        if: matrix.toolchain == 'clang'
        shell: bash
        run: |
          libcxx_library="$(find "$LLVM_PATH/lib" -type f \( -name 'libc++.so*' -o -name 'libc++.a' \) -print -quit)"
          test -n "$libcxx_library"
          libcxx_library_dir="$(dirname "$libcxx_library")"
          {
            echo "CXXFLAGS=-stdlib=libc++"
            echo "LDFLAGS=-L$libcxx_library_dir -L$LLVM_PATH/lib"
            echo "LD_LIBRARY_PATH=$libcxx_library_dir:$LLVM_PATH/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          } >> "$GITHUB_ENV"

      - name: Set up the Visual Studio environment
        if: matrix.toolchain == 'msvc'
        shell: pwsh
        run: |
          $info = vswhere -latest -format json | ConvertFrom-Json
          $moduleName = 'Microsoft.VisualStudio.DevShell.dll'
          $modulePath = Join-Path $info.installationPath 'Common7' 'Tools' $moduleName
          Import-Module $modulePath
          Enter-VsDevShell `
            -VsInstanceId $info.instanceId `
            -SkipAutomaticLocation `
            -DevCmdArguments "-arch=x64 -no_logo"
          Get-ChildItem 'env:' | ForEach-Object {
            "$($_.Name)=$($_.Value)" >> $env:GITHUB_ENV
          }

      - name: Set up vcpkg and its binary cache
        uses: ./.github/actions/setup-vcpkg
        with:
          triplet: ${{ matrix.triplet }}
          toolchain: ${{ matrix.toolchain }}

      - name: Build and test
        if: ${{ !matrix.check-installed }}
        run: just cpp validate ${{ matrix.preset }}

      - name: Build, test, and validate the installed CMake package
        if: matrix.check-installed
        run: just cpp check-installed ${{ matrix.preset }}

      - name: Generate representative experiment data
        if: matrix.produce-simulation
        shell: bash
        run: |
          mkdir -p out/ci
          out/build/${{ matrix.preset }}/apps/egea/hilbert-egea \
            --duration 20 --output out/ci/simulation-egea.txt
          out/build/${{ matrix.preset }}/apps/phase-scan/hilbert-phase-scan \
            --start-frequency 1 --end-frequency 5 --frequency-step 1 \
            --output out/ci/simulation-phase-scan.txt

      - name: Upload representative experiment data
        if: matrix.produce-simulation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: experiment-data
          path: out/ci/
          if-no-files-found: error
          retention-days: 1

  python-integration:
    name: Python integration (${{ matrix.python }})
    needs: native
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    env:
      MPLBACKEND: Agg
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}

      - name: Set up repository tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: just uv

      - name: Download representative experiment data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: experiment-data
          path: out/ci

      - name: Validate and render EGEA data
        run: |
          just py validate-egea out/ci/simulation-egea.txt
          just py plot-egea out/ci/simulation-egea.txt --save out/ci/simulation-egea.png --no-show

      - name: Validate and render phase-scan data
        run: |
          just py validate-phase-scan out/ci/simulation-phase-scan.txt
          just py plot-phase-scan out/ci/simulation-phase-scan.txt --save out/ci/simulation-phase-scan.png --no-show

  nix:
    name: Nix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0

      - name: Check flake outputs
        run: nix flake check -L

      - name: Verify the development environment
        run: nix develop -c just verify
