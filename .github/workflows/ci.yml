name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Do not let repository-tool installs resolve missing lock data in CI.
  MISE_LOCKED: "1"
  LLVM_VERSION: "22.1.6"
  LLVM_LINUX_X64_SHA256: c5ac8ef89ca39d30cb32e9b83772f995dd891c685ebc188d593c943a64d5f8b5
  LLVM_WINDOWS_X64_SHA256: e2d9a6855ff22c0acf3adc87ff1e1ad9705b8b6fc5bab2542aefc3315fc24cf7

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Set up repository tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: clang-format gersemi just node oxfmt precious uv

      - name: Check formatting
        run: just check format all

  native-linux:
    name: Native packaging (Linux GCC 15)
    runs-on: ubuntu-latest
    env:
      CC: gcc-15
      CXX: g++-15
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up repository tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: cmake ninja just

      - name: Install GCC 15
        shell: bash
        run: |
          # ubuntu-latest only includes GCC through version 14.
          sudo add-apt-repository --yes --no-update ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-15 g++-15

      - name: Set up vcpkg and its binary cache
        uses: ./.github/actions/setup-vcpkg
        with:
          triplet: x64-linux
          toolchain: gcc

      - name: Build and test static Release
        run: just cpp validate vcpkg-release

      - name: Test installed static CMake package
        run: just cpp check-installed vcpkg-release

      - name: Build and test shared Release
        run: just cpp validate vcpkg-shared-release

      - name: Test installed shared CMake package
        run: just cpp check-installed vcpkg-shared-release

  native-windows:
    name: Native packaging (Windows MSVC)
    runs-on: windows-latest
    env:
      CC: cl.exe
      CXX: cl.exe
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up repository tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: cmake ninja just

      - name: Set up the Visual Studio environment
        shell: pwsh
        run: |
          $info = vswhere -latest -format json | ConvertFrom-Json
          $moduleName = 'Microsoft.VisualStudio.DevShell.dll'
          $modulePath = Join-Path $info.installationPath 'Common7' 'Tools' $moduleName
          Import-Module $modulePath
          Enter-VsDevShell `
            -VsInstanceId $info.instanceId `
            -SkipAutomaticLocation `
            -DevCmdArguments "-arch=x64 -no_logo"
          Get-ChildItem 'env:' | ForEach-Object {
            "$($_.Name)=$($_.Value)" >> $env:GITHUB_ENV
          }

      - name: Set up vcpkg and its binary cache
        uses: ./.github/actions/setup-vcpkg
        with:
          triplet: x64-windows
          toolchain: msvc

      - name: Build and test static Release
        run: just cpp validate vcpkg-release

      - name: Test installed static CMake package
        run: just cpp check-installed vcpkg-release

      - name: Build and test shared Release
        run: just cpp validate vcpkg-shared-release

      - name: Test installed shared CMake package
        run: just cpp check-installed vcpkg-shared-release

  quality:
    name: Native, Python, and workflow quality (Linux Clang)
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Set up repository tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: actionlint clang-tools cmake ninja just shellcheck uv

      - name: Install pinned LLVM
        uses: hydn10/setup-llvm@v1
        with:
          version: ${{ env.LLVM_VERSION }}
          linux-x64-sha256: ${{ env.LLVM_LINUX_X64_SHA256 }}
          windows-x64-sha256: ${{ env.LLVM_WINDOWS_X64_SHA256 }}

      - name: Select the installed Clang compiler
        shell: bash
        run: |
          echo "CC=${LLVM_PATH}/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=${LLVM_PATH}/bin/clang++" >> "$GITHUB_ENV"

      - name: Set up vcpkg and its binary cache
        uses: ./.github/actions/setup-vcpkg
        with:
          triplet: x64-linux
          toolchain: clang

      - name: Run native, Python, and workflow quality checks
        run: just check lint all vcpkg-quality

  python-integration:
    name: Native/Python integration (${{ matrix.name }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            python: "3.10"
            cc: gcc-15
            cxx: g++-15
            triplet: x64-linux
            toolchain: gcc
          - name: Linux
            os: ubuntu-latest
            python: "3.14"
            cc: gcc-15
            cxx: g++-15
            triplet: x64-linux
            toolchain: gcc
          - name: Windows
            os: windows-latest
            python: "3.12"
            cc: cl.exe
            cxx: cl.exe
            triplet: x64-windows
            toolchain: msvc
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      MPLBACKEND: Agg
      UV_PYTHON: ${{ matrix.python }}
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}

      - name: Set up repository tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: cmake ninja just uv

      - name: Install GCC 15
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # ubuntu-latest only includes GCC through version 14.
          sudo add-apt-repository --yes --no-update ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-15 g++-15

      - name: Set up the Visual Studio environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $info = vswhere -latest -format json | ConvertFrom-Json
          $moduleName = 'Microsoft.VisualStudio.DevShell.dll'
          $modulePath = Join-Path $info.installationPath 'Common7' 'Tools' $moduleName
          Import-Module $modulePath
          Enter-VsDevShell `
            -VsInstanceId $info.instanceId `
            -SkipAutomaticLocation `
            -DevCmdArguments "-arch=x64 -no_logo"
          Get-ChildItem 'env:' | ForEach-Object {
            "$($_.Name)=$($_.Value)" >> $env:GITHUB_ENV
          }

      - name: Set up vcpkg and its binary cache
        uses: ./.github/actions/setup-vcpkg
        with:
          triplet: ${{ matrix.triplet }}
          toolchain: ${{ matrix.toolchain }}

      - name: Validate native-to-Python file integration
        run: just py validate vcpkg-release

  nix:
    name: Nix flake
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0

      - name: Build and check flake outputs
        run: nix flake check -L
