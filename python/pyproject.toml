[project]
name = "hilbert-plotter"
version = "0.1.0"
description = "Analysis and visualization tools for Hilbert simulation CSV data"
requires-python = ">=3.10"
license = "MIT"
classifiers = ["Private :: Do Not Upload", "Programming Language :: Python :: 3"]
dependencies = ["matplotlib>=3.10.0", "numpy>=2.2.2", "scipy>=1.15.1", "typer>=0.15.1"]

[dependency-groups]
dev = ["pytest>=8.3.4", "ruff>=0.9.6"]

[project.scripts]
plotter = "plotter.main:run_cli"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plotter"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["plotter", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
